[project]
name = "ligue1-dashboard"
version = "0.1.0"
description = "Dashboard Ligue 1 alimenté par un pipeline quotidien : football-data.org → DuckDB → dbt → Streamlit."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Noah" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "duckdb>=1.1",
    "dbt-core>=1.10",
    "dbt-duckdb>=1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ligue1"]

# --- Lint & format -----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "D",       # docstrings
]
ignore = ["D100", "D104", "D203", "D213", "D401"]  # D401 : docstrings en français

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# --- Typage ------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

# --- Tests -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
