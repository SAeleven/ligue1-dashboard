version: 2

sources:
  - name: raw
    description: >
      Réponses brutes de l'API football-data.org v4, chargées par `ligue1.load`.
      Une ligne par fichier de la couche raw (un snapshot par endpoint et par jour),
      la réponse complète étant conservée dans la colonne JSON `payload`.
    schema: raw
    tables:
      - name: matches
        description: Snapshots de `/competitions/FL1/matches`.
      - name: standings
        description: Snapshots de `/competitions/FL1/standings`.
      - name: teams
        description: Snapshots de `/competitions/FL1/teams`.
      - name: scorers
        description: Snapshots de `/competitions/FL1/scorers` (peut être vide).
